name: Savvy
description: >-
  Savvy (Savvy Advisors, Inc.) is a technology-driven, SEC-registered investment
  advisory firm founded in 2021 and headquartered in New York, NY. It combines
  licensed fiduciary financial advisors with proprietary technology — including
  Savvy Intelligence, an AI workspace for advisors — to deliver personalized
  wealth management for high-net-worth individuals and independent financial
  advisors. Savvy manages $5B+ in assets across 100+ advisors in 30+ U.S.
  locations, custodying at Fidelity and Charles Schwab. The firm serves two
  audiences: clients seeking wealth management (financial planning, investment
  management, direct indexing, tax optimization, retirement, trust and estate
  planning) and advisors looking to join or build a practice on its platform.
  Savvy publishes no public developer API; this profile captures its identity,
  domain security posture, and the verbatim /llms.txt it exposes for agents.
